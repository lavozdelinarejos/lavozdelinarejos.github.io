        <h2>LA VOZ DEL AFICIONADO</h2>
        <p>Este es tu espacio. Comparte tu opinión sobre el Linares Deportivo.</p>

        <section class="formulario-opinion">
            <h3>Publica tu opinión</h3>

            <form id="formulario-opinion">
                <label for="nombre">Nombre o apodo</label>
                <input type="text" id="nombre" placeholder="Tu nombre">

                <label for="titulo">Título</label>
                <input type="text" id="titulo" placeholder="Título de tu opinión">

                <label for="mensaje">Tu opinión</label>
                <textarea id="mensaje" rows="6" placeholder="Escribe aquí..."></textarea>

                <button type="submit">Enviar opinión</button>
            </form>
        <section class="opiniones-publicadas">
    <h3>Opiniones de la afición</h3>
    <div id="lista-opiniones"></div>
</section>
